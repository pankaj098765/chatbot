version: "3.9"

services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    # Environment variables listed here (without a value) are passed through
    # from the host shell when set, allowing runtime injection without
    # modifying the .env file (e.g. in CI/CD pipelines).  When a variable is
    # NOT present in the shell the entry is simply ignored and the value from
    # the env_file above is used instead.
    environment:
      - BOT_TOKEN
      - MONGODB_URI
      - REDIS_URL
      - DB_NAME
      - LLM_PROVIDER
      - LLM_API_KEY
      - LLM_MODEL
      - LLM_BASE_URL
      - LLM_ENABLED
      - OPENAI_API_KEY
      - AI_ENABLED
      - PAYMENT_ENABLED
      - DEBUG
    depends_on:
      - redis
      - mongo

  admin:
    build: .
    restart: always
    command: python -m admin.main
    env_file:
      - .env
    # Environment variables listed here (without a value) are passed through
    # from the host shell when set, allowing runtime injection without
    # modifying the .env file (e.g. in CI/CD pipelines).  When a variable is
    # NOT present in the shell the entry is simply ignored and the value from
    # the env_file above is used instead.
    environment:
      - ADMIN_TOKEN
      - MONGODB_URI
      - REDIS_URL
      - DB_NAME
      - BRAND_NAME
      - LANGUAGE_MODE
      - NATIVE_LANGUAGE
      - DEBUG
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:alpine
    restart: always

  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
