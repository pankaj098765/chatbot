version: "3.9"

services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    # Environment variables defined here take priority over the .env file.
    # Values use shell variable substitution so they can be injected at
    # runtime without modifying the .env file (e.g. in CI/CD pipelines).
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - REDIS_URL=${REDIS_URL:-}
      - DB_NAME=${DB_NAME:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_ENABLED=${LLM_ENABLED:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-}
      - PAYMENT_ENABLED=${PAYMENT_ENABLED:-}
      - DEBUG=${DEBUG:-}
    depends_on:
      - redis
      - mongo

  admin:
    build: .
    restart: always
    command: python -m admin.main
    env_file:
      - .env
    # Environment variables defined here take priority over the .env file.
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - REDIS_URL=${REDIS_URL:-}
      - DB_NAME=${DB_NAME:-}
      - BRAND_NAME=${BRAND_NAME:-}
      - LANGUAGE_MODE=${LANGUAGE_MODE:-}
      - NATIVE_LANGUAGE=${NATIVE_LANGUAGE:-}
      - DEBUG=${DEBUG:-}
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:alpine
    restart: always

  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
